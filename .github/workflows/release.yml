name: Release @dalgo/core

on:
  push:
    branches: [main]

concurrency:
  group: release-core
  cancel-in-progress: false

jobs:
  version-pr:
    name: Update version pull request
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select Changesets mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - name: Create or update the reviewed version pull request
        id: version
        if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm version-packages
          commit-message: "chore: version @dalgo/core"
          pr-title: "chore: version @dalgo/core"
          pr-base-branch: main
      - name: Run CI on the version pull request head
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref changeset-release/main

  authorize-release:
    name: Verify merged version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.verify.outputs.eligible }}
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Require the generated marker and merged version pull request
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf 'eligible=false\n' > "$GITHUB_OUTPUT"

          version=$(node -p "require('./package.json').version")
          marker=".changeset/releases/core@v${version}.json"
          [[ -f "$marker" ]] || exit 0
          jq -e --arg version "$version" '
            .schemaVersion == 1 and
            .package == "@dalgo/core" and
            .version == $version and
            .tag == ("core@v" + $version) and
            (.previousVersion | type == "string")
          ' "$marker" >/dev/null

          prs=$(gh api "/repos/$REPOSITORY/commits/$SHA/pulls")
          pr=$(jq -c '[.[] | select(
            .merged_at != null and
            .base.ref == "main" and
            .head.ref == "changeset-release/main" and
            .title == "chore: version @dalgo/core"
          )] | if length == 1 then .[0] else empty end' <<< "$prs")
          [[ -n "$pr" ]] || exit 0

          pr_number=$(jq -r '.number' <<< "$pr")
          files=$(gh api --paginate --slurp "/repos/$REPOSITORY/pulls/$pr_number/files")
          jq -e --arg marker "$marker" '
            flatten | map(.filename) as $files |
            ($files | index("package.json")) != null and
            ($files | index("CHANGELOG.md")) != null and
            ($files | index($marker)) != null
          ' <<< "$files" >/dev/null

          {
            echo "eligible=true"
            echo "version=$version"
            echo "tag=core@v$version"
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish reviewed version
    needs: authorize-release
    if: needs.authorize-release.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Verify release identity and registry state
        id: registry
        env:
          VERSION: ${{ needs.authorize-release.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(node -p "require('./package.json').name")" == '@dalgo/core' ]]
          [[ "$(node -p "require('./package.json').version")" == "$VERSION" ]]
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          npm_version=$(npm --version)
          [[ "$(printf '%s\n' '11.5.1' "$npm_version" | sort -V | head -n1)" == '11.5.1' ]]
          metadata=$(npm view "@dalgo/core@$VERSION" name version gitHead --json 2>/dev/null || true)
          if [[ -n "$(jq -r '.version // empty' <<< "$metadata")" ]]; then
            [[ "$(jq -r '.name' <<< "$metadata")" == '@dalgo/core' ]]
            [[ "$(jq -r '.version' <<< "$metadata")" == "$VERSION" ]]
            [[ "$(jq -r '.gitHead' <<< "$metadata")" == "$SHA" ]]
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish with npm trusted publishing
        if: steps.registry.outputs.publish == 'true'
        run: pnpm release:publish
      - name: Verify npm provenance commit and create package tag
        env:
          VERSION: ${{ needs.authorize-release.outputs.version }}
          TAG: ${{ needs.authorize-release.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            metadata=$(npm view "@dalgo/core@$VERSION" name version gitHead --json 2>/dev/null || true)
            if [[ "$(jq -r '.gitHead // empty' <<< "$metadata")" == "$SHA" ]]; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "npm metadata did not confirm gitHead $SHA" >&2
              exit 1
            fi
            sleep 10
          done
          [[ "$(jq -r '.name' <<< "$metadata")" == '@dalgo/core' ]]
          [[ "$(jq -r '.version' <<< "$metadata")" == "$VERSION" ]]
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            [[ "$(git rev-list -n 1 "$TAG")" == "$SHA" ]]
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" "$SHA" -m "@dalgo/core $TAG"
          git push origin "refs/tags/$TAG"
