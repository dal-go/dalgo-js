name: Publish package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact @dalgo/core version from package.json
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-core-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Verify release identity
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$(node -p "require('./package.json').version")" == "$VERSION" ]]
          [[ "$(git rev-parse HEAD)" == "$SHA" ]]
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main
          npm_version=$(npm --version)
          [[ "$(printf '%s\n' '11.5.1' "$npm_version" | sort -V | head -n1)" == '11.5.1' ]]
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: npm run build
      - run: npm publish --provenance
